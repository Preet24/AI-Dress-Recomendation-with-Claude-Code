[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outfit"
version = "0.1.0"
description = "Outfit recommender: wardrobe ingestion, vector search and multi-agent recommendations"
requires-python = ">=3.11"
# torch is intentionally not listed. open_clip_torch needs it, but the existing
# torch build in the environment must never be replaced (see CLAUDE.md).
dependencies = [
    # Agent orchestration only (graph, state, interrupt, checkpointer); brings langchain-core.
    "langgraph>=1.2,<2",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "open_clip_torch>=2.24",
    # Client for DeepSeek's OpenAI-compatible API (DeepSeek has no SDK of its own).
    "openai>=3.0",
    "pillow>=10.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "qdrant-client>=1.10",
    "rembg>=2.0.60",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    # zoneinfo has no time zone database on Windows; needed for local time at a place.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# HTTP API (Phase 6); python-multipart parses photo uploads.
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# Streamlit UI (Phase 7); it reaches the API with httpx. 1.50+ for widgets' width="stretch".
ui = ["streamlit>=1.50", "httpx>=0.27"]
# httpx powers FastAPI's TestClient.
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
outfit = ["prompts/*.md", "tools/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: runs real ONNX models on CPU (downloads weights on first run)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
