# --- Refine: follow-ups through the ReAct loop -----------------------------------

[[scenarios]]
id = "swap_to_jeans"
about = "A requested swap: find the jeans, re-plan with them, pass on the warning that they are casual."
tags = ["refine"]

[[scenarios.turns]]
say = "Party in Pune tonight at 7, about 4 hours, half an hour outside, going by cab"

[[scenarios.turns]]
say = "something with my blue jeans instead"
[scenarios.turns.expect]
intent = "follow_up"
tools = ["update_request"]
plan_includes = ["jeans"]
# The warning (not party wear, formality 2, warmth 3) may be put in several ways.
reply_mentions = ["jeans", "casual|warm|warmer|dressy|formal|relaxed"]

[[scenarios]]
id = "show_my_tops"
about = "'Show me' puts the items in front of the user."
tags = ["refine"]

[[scenarios.turns]]
say = "casual day in Pune from now, 3 hours, an hour of it outside, walking"

[[scenarios.turns]]
say = "show me all my tops"
[scenarios.turns.expect]
intent = "follow_up"
tools = ["show_items"]
found_min = 4
reply_mentions = ["sequin", "plaid"]

[[scenarios]]
id = "item_not_in_wardrobe"
about = "Asking for something the user doesn't own: search, then say it isn't there."
tags = ["refine"]

[[scenarios.turns]]
say = "Party in Pune tonight at 7, about 4 hours, half an hour outside, going by cab"

[[scenarios.turns]]
say = "can I wear my red saree instead?"
[scenarios.turns.expect]
intent = "follow_up"
tools = ["search_wardrobe"]
reply_mentions = ["saree"]

[[scenarios]]
id = "less_formal"
about = "'More relaxed' changes the request and re-plans."
tags = ["refine"]

[[scenarios.turns]]
say = "Party in Pune tonight at 7, about 4 hours, half an hour outside, going by cab"

[[scenarios.turns]]
say = "something a bit more relaxed please"
[scenarios.turns.expect]
intent = "follow_up"
tools = ["update_request"]

