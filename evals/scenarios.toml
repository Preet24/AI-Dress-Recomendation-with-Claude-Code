# Agent eval scenarios (Phase 5). Schema and check semantics: src/outfit/evals/.
#
# Each scenario is a short conversation. A turn's `say` is a new message, or the
# answer when the previous turn asked a question. `expect` lists what must be true
# after that turn; anything left out is not checked. Metrics every turn gets anyway
# (critic revisions, template fallbacks, LLM calls, tokens, time) need no expectation.
#
# Written against the real wardrobe (10 items, snapshotted for the eval):
#   tops: black button-up shirt, off-white graphic t-shirt, olive grey button-down
#         shirt, black sequin top, mauve plaid shirt
#   bottoms: lavender skirt (flowy), beige trousers (flowy), medium blue jeans
#   one-piece: blush pink floral midi dress (flowy) · footwear: champagne slingback
#   heel pumps · no outerwear
#
# Weather fixtures: warm_dry (default, ~29 °C feels-like, dry, calm), rainy (~24 °C,
# 80% rain), cold (~8 °C, dry).

now = 2026-10-17T16:00:00  # a Saturday afternoon

# --- Intake: understanding a new request -----------------------------------------

[[scenarios]]
id = "party_all_at_once"
about = "Every detail in one message: no questions, a full recommendation."
tags = ["intake", "stylist"]

[[scenarios.turns]]
say = "Party in Pune tonight at 7, about 4 hours, half an hour outside, going by cab"
[scenarios.turns.expect]
intent = "new"
asks = false
slots = { occasion = "party", city = "Pune", start = "19:00", hours_away = 4, hours_outdoors = 0.5, transport = "car" }
names_top_outfit = true

[[scenarios]]
id = "party_vague_then_answer"
about = "A vague request gets one combined question; the answer completes it."
tags = ["intake", "ask"]

[[scenarios.turns]]
say = "what should I wear to a party tonight?"
[scenarios.turns.expect]
intent = "new"
asks = true
missing = ["city", "hours_away", "hours_outdoors", "transport"]
slots = { occasion = "party", start = "19:00" }

[[scenarios.turns]]
say = "Pune, 4 hours, maybe half an hour outside, by cab"
[scenarios.turns.expect]
asks = false
slots = { city = "Pune", hours_away = 4, hours_outdoors = 0.5, transport = "car" }
names_top_outfit = true

[[scenarios]]
id = "casual_party_misspelt_city_tomorrow"
about = "A real failure: 'casual' sets formality, 'Banglore' is corrected, 'tomorrow' is not 'now', and the plan is not empty."
tags = ["intake", "ask", "weather"]

[[scenarios.turns]]
say = "I have casual party and dinner in Banglore tommorow, mix of outdoor and indoor. It is casual and I will be out for 3 hours and will use a cab"
[scenarios.turns.expect]
intent = "new"
asks = true
missing = ["hours_outdoors"]
slots = { occasion = "party", formality = [2, 3], city = "Bangalore", start = "tomorrow 19:00", hours_away = 3, transport = "car" }

[[scenarios.turns]]
say = "About 2 hours"
[scenarios.turns.expect]
asks = false
slots = { hours_outdoors = 2 }
names_top_outfit = true

[[scenarios]]
id = "office_partial_by_scooter"
about = "Asks only for what is missing; a scooter rules out the flowy office bottoms, and the reply must say why."
tags = ["intake", "ask", "weather"]

[[scenarios.turns]]
say = "office tomorrow at 9 in Pune"
[scenarios.turns.expect]
intent = "new"
asks = true
missing = ["hours_away", "hours_outdoors", "transport"]
slots = { occasion = "office", city = "Pune", start = "tomorrow 09:00" }

[[scenarios.turns]]
say = "about 9 hours, 20 minutes outside, by scooter"
[scenarios.turns.expect]
asks = false
slots = { hours_away = 9, hours_outdoors = [0.3, 0.35], transport = "two_wheeler" }
reply_mentions = ["flowy|wheels|riding|scooter"]

[[scenarios]]
id = "relative_start_time"
about = "'In 2 hours' becomes a clock time from now (16:00)."
tags = ["intake"]

[[scenarios.turns]]
say = "Meeting friends in Mumbai in 2 hours, casual. Out for 3 hours, about 2 of them outside, walking"
[scenarios.turns.expect]
intent = "new"
asks = false
slots = { occasion = "casual", city = "Mumbai", start = "18:00", hours_away = 3, hours_outdoors = 2, transport = "walk" }

[[scenarios]]
id = "bicycle_is_bike"
about = "'Cycling' is a bicycle, not a motorbike."
tags = ["intake"]

[[scenarios.turns]]
say = "casual coffee in Pune now, 2 hours, 30 minutes outside, cycling there"
[scenarios.turns.expect]
asks = false
slots = { occasion = "casual", start = "now", transport = "bike" }

[[scenarios]]
id = "indian_english_bike"
about = "In Indian English 'my bike' usually means a motorbike."
tags = ["intake"]

[[scenarios.turns]]
say = "casual coffee in Pune now, 2 hours, 30 minutes outside, going on my bike"
[scenarios.turns.expect]
asks = false
slots = { transport = "two_wheeler" }

[[scenarios]]
id = "skip_weather"
about = "The user doesn't know where or when: plan without weather, no questions."
tags = ["intake"]

[[scenarios.turns]]
say = "Suggest a party outfit, I don't know the venue or the timing yet"
[scenarios.turns.expect]
intent = "new"
asks = false
slots = { occasion = "party", skip_weather = true }
names_top_outfit = true

[[scenarios]]
id = "interview_is_formal_office"
about = "An interview is office wear with formality 4-5."
tags = ["intake"]

[[scenarios.turns]]
say = "job interview tomorrow at 10 in Bangalore, 3 hours, 10 minutes outside, by cab"
[scenarios.turns.expect]
asks = false
slots = { occasion = "office", formality = [4, 5], city = "Bangalore", start = "tomorrow 10:00", transport = "car" }

[[scenarios]]
id = "must_include_in_first_message"
about = "An item named in the request is in every outfit."
tags = ["intake", "orchestrate"]

[[scenarios.turns]]
say = "party tonight at 8 in Pune with my black sequin top, 4 hours, 30 minutes outside, cab"
[scenarios.turns.expect]
asks = false
plan_includes = ["sequin"]
reply_mentions = ["sequin"]

[[scenarios]]
id = "exclude_an_item"
about = "An item the user rules out is in no outfit."
tags = ["intake", "orchestrate"]

[[scenarios.turns]]
say = "casual day in Pune from now, 3 hours, an hour of it outside, walking, but not the jeans"
[scenarios.turns.expect]
asks = false
plan_excludes = ["jeans"]
# Not reply_avoids: the reply rightly names the jeans when confirming what "not the
# jeans" was taken to mean (assumptions must be passed on).

[[scenarios]]
id = "give_up_after_three_questions"
about = "Three unhelpful answers: stop asking, assume casual without weather, and say so."
tags = ["intake", "ask"]

[[scenarios.turns]]
say = "what should I wear?"
[scenarios.turns.expect]
asks = true
missing = ["occasion"]

[[scenarios.turns]]
say = "not sure yet"
[scenarios.turns.expect]
asks = true

[[scenarios.turns]]
say = "no idea"
[scenarios.turns.expect]
asks = true

[[scenarios.turns]]
say = "dunno"
[scenarios.turns.expect]
asks = false
slots = { occasion = "casual", skip_weather = true }
reply_mentions = ["casual", "weather"]

# --- More occasions, places and times (tag "expanded") ----------------------------
