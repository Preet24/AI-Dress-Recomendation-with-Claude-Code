# --- The profile: saved places and the home city (tag "profile") -----------------

[[scenarios]]
id = "office_tomorrow_confirmed"
about = "'Office tomorrow' with a saved Office: dress code and usual start at once, the usual trip after a yes, home city as the city."
tags = ["profile", "intake", "ask"]

[scenarios.profile]
home_city = "Pune"
places = [{ name = "Office", occasion = "office", dress_code = "business_casual", start = 09:00:00, hours_away = 9, hours_outdoors = 0.25, transport = "car" }]

[[scenarios.turns]]
say = "what should I wear to office tomorrow?"
[scenarios.turns.expect]
intent = "new"
asks = true
missing = ["saved_trip"]
slots = { place = "Office", occasion = "office", formality = [3, 4], city = "Pune", start = "tomorrow 09:00" }

[[scenarios.turns]]
say = "yes"
[scenarios.turns.expect]
asks = false
slots = { use_saved_trip = true, hours_away = 9, hours_outdoors = 0.25, transport = "car" }
names_top_outfit = true

[[scenarios]]
id = "office_tomorrow_with_changes"
about = "'Yes, but ...' keeps the changes and takes the rest of the usual trip."
tags = ["profile", "intake", "ask"]

[scenarios.profile]
home_city = "Pune"
places = [{ name = "Office", occasion = "office", dress_code = "business_casual", start = 09:00:00, hours_away = 9, hours_outdoors = 0.25, transport = "car" }]

[[scenarios.turns]]
say = "office tomorrow"
[scenarios.turns.expect]
asks = true
missing = ["saved_trip"]

[[scenarios.turns]]
say = "yes, but I'll ride my scooty and stay 11 hours"
[scenarios.turns.expect]
asks = false
slots = { hours_away = 11, hours_outdoors = 0.25, transport = "two_wheeler", start = "tomorrow 09:00" }

[[scenarios]]
id = "office_not_as_usual"
about = "'No' to the usual trip falls back to the normal questions."
tags = ["profile", "intake", "ask"]

[scenarios.profile]
home_city = "Pune"
places = [{ name = "Office", occasion = "office", dress_code = "business_casual", start = 09:00:00, hours_away = 9, hours_outdoors = 0.25, transport = "car" }]

[[scenarios.turns]]
say = "office tomorrow"
[scenarios.turns.expect]
asks = true
missing = ["saved_trip"]

[[scenarios.turns]]
say = "no, different today"
[scenarios.turns.expect]
asks = true
missing = ["hours_away", "hours_outdoors", "transport"]
slots = { use_saved_trip = false, formality = [3, 4] }

[[scenarios]]
